[project]
name = "polystore"
version = "0.3.0"
description = "Placement as Schema: a read-only GraphQL federation engine over PostgreSQL and MongoDB, built to measure where federation stops paying."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "graphql-core>=3.2,<3.3",
    "psycopg[binary]>=3.2,<4",
    "pymongo>=4.8,<5",
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
analysis = ["pandas>=2.2,<3", "matplotlib>=3.9,<4"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "hypothesis>=6.100,<7",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "oracle", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs the three databases running (make up && make data)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
source = ["engine"]
